name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (agent + protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            apps/agent/go.sum
            packages/protocol/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l apps/agent packages/protocol)"
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./apps/agent/... ./packages/protocol/...
      - name: test (workspace)
        run: go test -race -count=1 ./apps/agent/... ./packages/protocol/...
      - name: test (module mode, no go.work)
        env:
          GOWORK: "off"
        run: |
          (cd packages/protocol && go test -count=1 ./...)
          (cd apps/agent && go test -count=1 ./...)
      - name: cross-build agent
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/jafesu/deckbeacon/apps/agent/internal/buildinfo.Commit=${GITHUB_SHA::7}" \
              -o dist/deckbeacon-linux-$arch ./apps/agent/cmd/deckbeacon
          done
          file dist/*
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          (cd apps/agent && "$(go env GOPATH)/bin/govulncheck" ./...)
          (cd packages/protocol && "$(go env GOPATH)/bin/govulncheck" ./...)

  protocol-python:
    name: Protocol contract (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/protocol/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  fixtures:
    name: Fixtures, vendored schemas, security greps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_fixtures.py packages/protocol/fixtures
      - run: python3 scripts/sync_schemas.py --check
      - name: no HA access tokens in the agent (M2-AC3, ADR-0002)
        run: |
          if grep -rniE 'access_token|long[_ -]?lived|authorization|bearer' apps/agent --include=*.go; then
            echo "agent code must never handle Home Assistant tokens"; exit 1
          fi
      - name: no privilege escalation in the agent (M3-AC7, ADR-0003)
        run: |
          if grep -rnE '"(sudo|pkexec|doas|su)"|"--system"' apps/agent --include=*.go | grep -v _test.go; then
            echo "the agent must never escalate privileges or touch system units"; exit 1
          fi

  homeassistant:
    name: HA integration + E2E (${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "minimum 2026.5"
            phcc: "pytest-homeassistant-custom-component==0.13.330"
          - ha: "latest"
            phcc: "pytest-homeassistant-custom-component"
    defaults:
      run:
        working-directory: apps/homeassistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/agent/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: build agent for E2E
        run: |
          (cd ../agent && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/deckbeacon" ./cmd/deckbeacon)
          echo "DECKBEACON_AGENT_BIN=$RUNNER_TEMP/deckbeacon" >> "$GITHUB_ENV"
      - run: pip install "${{ matrix.phcc }}" jsonschema==4.26.0 ruff==0.17.5 pytest-timeout
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --timeout 300

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
