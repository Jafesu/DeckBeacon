[project]
name = "deckbeacon-homeassistant"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S", "ASYNC", "PT"]
ignore = ["S101", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]
"custom_components/deckbeacon/noise.py" = ["S105"]  # Noise pattern tokens ("e", "s", "ee") are not passwords

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
